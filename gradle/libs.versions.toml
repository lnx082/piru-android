[versions]
agp = "9.4.1"
kotlin = "2.4.20"
composeBom = "2026.09.00"
coreKtx = "1.19.1"
activityCompose = "1.13.0"
lifecycle = "2.11.0"
navigationCompose = "2.10.2"
coroutines = "1.11.0"
serialization = "1.11.0"
room = "2.8.5"
ksp = "2.3.12"
sqlite = "2.7.1"
sqliteJdbc = "3.53.4.0"
junit = "6.1.3"
kotest = "6.2.5"
androidxTestJunit = "1.3.0"
androidxTestRunner = "1.7.0"
# Health Connect. 1.1.0 is the stable line; 1.2.x is alpha-only, and a health
# permission surface is not somewhere to ship an alpha.
healthConnect = "1.1.0"
work = "2.12.0"
# Glance, for the home-screen widgets. 1.1.1 is the stable line: the widget is a
# surface a user puts on their home screen and looks at without opening the app, so
# an alpha there is not a trade worth making.
glance = "1.1.1"
[libraries]
androidx-core-ktx = { module = "androidx.core:core-ktx", version.ref = "coreKtx" }
androidx-activity-compose = { module = "androidx.activity:activity-compose", version.ref = "activityCompose" }
androidx-lifecycle-runtime-ktx = { module = "androidx.lifecycle:lifecycle-runtime-ktx", version.ref = "lifecycle" }
androidx-lifecycle-viewmodel-compose = { module = "androidx.lifecycle:lifecycle-viewmodel-compose", version.ref = "lifecycle" }
androidx-navigation-compose = { module = "androidx.navigation:navigation-compose", version.ref = "navigationCompose" }

compose-bom = { module = "androidx.compose:compose-bom", version.ref = "composeBom" }
compose-ui = { module = "androidx.compose.ui:ui" }
compose-ui-graphics = { module = "androidx.compose.ui:ui-graphics" }
compose-ui-tooling = { module = "androidx.compose.ui:ui-tooling" }
compose-ui-tooling-preview = { module = "androidx.compose.ui:ui-tooling-preview" }
compose-material3 = { module = "androidx.compose.material3:material3" }

# The small core icon set. Not transitive through material3, and `extended` is a
# few thousand vectors for the five a tab bar needs.
compose-material-icons-core = { module = "androidx.compose.material:material-icons-core" }

androidx-room-runtime = { module = "androidx.room:room-runtime", version.ref = "room" }
androidx-room-ktx = { module = "androidx.room:room-ktx", version.ref = "room" }
androidx-room-compiler = { module = "androidx.room:room-compiler", version.ref = "room" }
androidx-room-testing = { module = "androidx.room:room-testing", version.ref = "room" }

# Instrumented tests: the Room DAOs are verified against real SQLite on a device
# rather than a shadow of it, so the SQL and the generated bindings are the ones
# that actually ship.
androidx-test-ext-junit = { module = "androidx.test.ext:junit", version.ref = "androidxTestJunit" }
androidx-test-runner = { module = "androidx.test:runner", version.ref = "androidxTestRunner" }

# Health Connect: the platform's on-device health store. Not a vendor SDK — see
# the header of `HealthConnectVitals.kt` for what that means for the user.
androidx-health-connect = { module = "androidx.health.connect:connect-client", version.ref = "healthConnect" }

# WorkManager. The notification scheduler's durable half: an alarm survives a
# reboot, but only a persisted work request survives the app being force-stopped
# and the next boot's reconciliation pass.
androidx-work-runtime-ktx = { module = "androidx.work:work-runtime-ktx", version.ref = "work" }

# Glance app widgets. `glance-appwidget` brings the Compose-style surface and the
# `GlanceAppWidget`/`GlanceAppWidgetReceiver` pair; `glance-material3` is not pulled
# in, because the widgets use the app's own `PiruColors` rather than Material's.
androidx-glance-appwidget = { module = "androidx.glance:glance-appwidget", version.ref = "glance" }

kotlinx-coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "coroutines" }
kotlinx-coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "coroutines" }
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "serialization" }

# The bundled SQLite driver: typed parameter binding (the framework's rawQuery
# takes only String[], which is silently wrong against an expression), and one
# SQLite version across every OEM build rather than whatever the device ships.
androidx-sqlite-bundled = { module = "androidx.sqlite:sqlite-bundled", version.ref = "sqlite" }

junit-jupiter = { module = "org.junit.jupiter:junit-jupiter", version.ref = "junit" }
junit-platform-launcher = { module = "org.junit.platform:junit-platform-launcher" }
kotest-assertions-core = { module = "io.kotest:kotest-assertions-core", version.ref = "kotest" }

# Test-only: backs the substance-database specs on the JVM so they run without an
# emulator. Production reads the same file through the Android framework SQLite —
# see :core:data's SubstanceDatabaseFactory.
sqlite-jdbc = { module = "org.xerial:sqlite-jdbc", version.ref = "sqliteJdbc" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
android-library = { id = "com.android.library", version.ref = "agp" }
# No kotlin-android entry: AGP 9 ships built-in Kotlin support and rejects the
# plugin outright. The JVM-only modules below still apply kotlin-jvm, which is a
# different plugin and unaffected.
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
room = { id = "androidx.room", version.ref = "room" }
